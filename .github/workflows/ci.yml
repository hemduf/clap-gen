name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI policy tests
        run: python3 -m unittest -v tests/bootstrap/test_ci_policy.py

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.8"
          archive="actionlint_${version}_linux_x86_64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          curl --fail --location --silent --show-error "${url}" --output "${archive}"
          echo "08a98bc7a54ff1bfccb3eb09c4bed2497150613f349567800facb82c8d6f14a9  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" actionlint
          echo "${PWD}" >> "${GITHUB_PATH}"

      - name: Lint workflows
        run: actionlint

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

  cpp:
    name: C++ (${{ matrix.os }}, ${{ matrix.build_type }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ analysis tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang-format cppcheck

      - name: Install C++ analysis tools (macOS)
        if: runner.os == 'macOS'
        run: brew install clang-format cppcheck

      - name: Install C++ analysis tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm cppcheck --no-progress -y

      - name: C++ format
        run: >-
          clang-format --dry-run --Werror
          runtime/include/clapgen/runtime.hpp
          runtime/src/runtime.cpp
          tests/runtime/runtime_smoke.cpp
          tests/codegen/issue48/instance_ownership_smoke.cpp
          tests/codegen/issue49/lifecycle_smoke.cpp
          tests/codegen/issue59/abi_contract.cpp
          tests/codegen/issue59/backend_smoke.cpp
          tests/codegen/issue59/backend_spy_smoke.cpp
          tests/codegen/issue60/factory_smoke.cpp
          tests/codegen/issue61/create_plugin_spy_smoke.cpp
          tests/codegen/issue62/entry_smoke.cpp
          tests/codegen/issue63/discovery_hardening_smoke.cpp
          tests/codegen/issue64/module_backend.cpp
          tests/codegen/issue64/dso_loader_smoke.cpp

      - name: C++ static analysis (Unix)
        if: runner.os != 'Windows'
        run: >-
          cppcheck --enable=warning,style,performance,portability
          --error-exitcode=1 --std=c++20 --suppress=missingIncludeSystem
          runtime tests/runtime tests/codegen/issue48 tests/codegen/issue49 tests/codegen/issue59 tests/codegen/issue60 tests/codegen/issue61 tests/codegen/issue62 tests/codegen/issue63 tests/codegen/issue64

      - name: C++ static analysis (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & 'C:\Program Files\Cppcheck\cppcheck.exe'
          --enable=warning,style,performance,portability
          --error-exitcode=1 --std=c++20 --suppress=missingIncludeSystem
          runtime tests/runtime tests/codegen/issue48 tests/codegen/issue49 tests/codegen/issue59 tests/codegen/issue60 tests/codegen/issue61 tests/codegen/issue62 tests/codegen/issue63 tests/codegen/issue64

      - name: Configure C++
        run: >-
          cmake -S . -B build/cpp
          -DBUILD_TESTING=ON
          -DCLAPGEN_FETCH_CLAP=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build C++
        run: cmake --build build/cpp --config ${{ matrix.build_type }}

      - name: Test C++
        run: ctest --test-dir build/cpp -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload CTest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ matrix.os }}-${{ matrix.build_type }}
          path: build/cpp/Testing/Temporary/LastTest.log

  sanitizers:
    name: Sanitizers (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure with ASan + UBSan
        run: >-
          cmake -S . -B build/sanitize
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'

      - name: Build sanitizer configuration
        run: cmake --build build/sanitize --config Debug

      - name: Run sanitizer tests
        run: ctest --test-dir build/sanitize -C Debug --output-on-failure

  required:
    name: Required CI gate
    if: always()
    needs: [policy, rust, cpp]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI component to pass
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ needs.policy.result }}' == 'success' ]]
          [[ '${{ needs.rust.result }}' == 'success' ]]
          [[ '${{ needs.cpp.result }}' == 'success' ]]
