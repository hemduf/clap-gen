name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CI policy tests
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py'

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint workflows
        shell: bash
        run: '"$(go env GOPATH)/bin/actionlint"'

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

  cpp:
    name: C++ (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C++ analysis tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang-format cppcheck

      - name: Install C++ analysis tools (macOS)
        if: runner.os == 'macOS'
        run: brew install clang-format cppcheck

      - name: Install C++ analysis tools (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm cppcheck --no-progress -y

      - name: C++ format
        run: >-
          clang-format --dry-run --Werror
          runtime/include/clapgen/runtime.hpp
          runtime/src/runtime.cpp
          tests/runtime/runtime_smoke.cpp
          tests/codegen/issue59/abi_contract.cpp
          tests/codegen/issue59/backend_smoke.cpp
          tests/codegen/issue59/backend_spy_smoke.cpp
          tests/codegen/issue60/factory_smoke.cpp

      - name: C++ static analysis (Unix)
        if: runner.os != 'Windows'
        run: >-
          cppcheck --enable=warning,style,performance,portability
          --error-exitcode=1 --std=c++20 --suppress=missingIncludeSystem
          runtime tests/runtime tests/codegen/issue59 tests/codegen/issue60

      - name: C++ static analysis (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          & 'C:\Program Files\Cppcheck\cppcheck.exe'
          --enable=warning,style,performance,portability
          --error-exitcode=1 --std=c++20 --suppress=missingIncludeSystem
          runtime tests/runtime tests/codegen/issue59 tests/codegen/issue60

      - name: Configure C++
        run: >-
          cmake -S . -B build/cpp
          -DBUILD_TESTING=ON
          -DCLAPGEN_FETCH_CLAP=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build C++
        run: cmake --build build/cpp --config ${{ matrix.build_type }}

      - name: Test C++
        run: ctest --test-dir build/cpp -C ${{ matrix.build_type }} --output-on-failure

      - name: Upload CTest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-${{ runner.os }}-${{ matrix.build_type }}
          path: build/cpp/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  sanitizers:
    name: Sanitizers (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build/sanitizers
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build ASan and UBSan
        run: cmake --build build/sanitizers --config Debug

      - name: Test ASan and UBSan
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers -C Debug --output-on-failure

      - name: Upload sanitizer CTest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizers-${{ runner.os }}
          path: build/sanitizers/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required CI gate
    if: always()
    needs: [policy, rust, cpp, sanitizers]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI component to pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          POLICY_RESULT: ${{ needs.policy.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          CPP_RESULT: ${{ needs.cpp.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
        shell: bash
        run: |
          test "$POLICY_RESULT" = success
          test "$RUST_RESULT" = success
          test "$CPP_RESULT" = success
          if [ "$EVENT_NAME" = push ]; then
            test "$SANITIZERS_RESULT" = success
          else
            test "$SANITIZERS_RESULT" = skipped
          fi
