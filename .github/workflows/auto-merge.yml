name: Conditional auto-merge

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enable:
    name: Enable native auto-merge
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/automerge' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Verify pull request eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          head_repo="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name')"
          base_ref="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.base.ref')"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Auto-merge is restricted to same-repository pull requests"
            exit 1
          fi
          if [ "$base_ref" != "main" ]; then
            echo "::error::Auto-merge is restricted to pull requests targeting main"
            exit 1
          fi

      - name: Verify repository auto-merge is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          enabled="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_auto_merge')"
          if [ "$enabled" != "true" ]; then
            echo "::error::Repository auto-merge is disabled in GitHub settings"
            exit 1
          fi

      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          gh pr merge --auto --squash "https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}"
