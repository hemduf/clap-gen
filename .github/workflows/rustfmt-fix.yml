name: Temporary rustfmt fix

on:
  push:
    branches:
      - feat/9-cmake-integration

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/9-cmake-integration
          fetch-depth: 0

      - name: Apply rustfmt
        run: cargo fmt --all

      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style(#9): apply rustfmt"
          git push origin HEAD:feat/9-cmake-integration
